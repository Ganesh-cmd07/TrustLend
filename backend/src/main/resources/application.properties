spring.application.name=backend

server.port=4040

app.jwt.secret=${TRUSTLEND_JWT_SECRET}


app.cors.allowed-origins=${TRUSTLEND_CORS_ORIGINS:http://localhost:5173}
app.admin.bootstrap.email=${TRUSTLEND_ADMIN_EMAIL:}
app.admin.bootstrap.name=${TRUSTLEND_ADMIN_NAME:TrustLend Administrator}
app.admin.bootstrap.password=${TRUSTLEND_ADMIN_PASSWORD:}
app.ai.chat-model=${TRUSTLEND_AI_CHAT_MODEL:gemini-2.5-flash}
app.ai.embedding-model=${TRUSTLEND_AI_EMBEDDING_MODEL:gemini-embedding-001}
app.ai.api-key=${TRUSTLEND_OPENAI_API_KEY:${GEMINI_API_KEY:[GCP_API_KEY]}}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
